name: Redirect GitHub Pages to rodado.xyz

on:
  push:
    branches:
      - main
  workflow_dispatch:

# rafapolo.github.io/datative/ is kept only as a redirect to the canonical
# rodado.xyz/plataformas/datative/, so links shared before the move still work.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site itself is published by rodado at rodado.xyz/plataformas/datative/
      # (see publica-rodado.yml). This address only redirects there: index.html
      # for the root and 404.html for every other path (e-<id>.html), both
      # keeping the path and the ?c= query.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
